<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="UTF-8"><title>UNVEIL / ClinicFlow Demo</title><style>body{font:15px -apple-system,system-ui;margin:0;background:#faf8f6;color:#252525}header{padding:20px;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}h1,h2{font-family:Georgia,serif;font-weight:normal}h1{margin:0;font-size:25px}main{padding:17px;max-width:720px;margin:auto}.switch{display:flex;gap:10px;margin-bottom:20px}.switch button{flex:1}.box{padding:17px;background:white;border:1px solid #e5dedb;border-radius:14px;margin:12px 0}button,input,select,textarea{font:inherit;border-radius:9px;padding:12px;box-sizing:border-box}input,select,textarea{width:100%;border:1px solid #d5cfca;background:#fff;margin:5px 0}button{border:1px solid #d1cbc5;background:white;cursor:pointer}button.active,.dark{background:#292929;color:#fff}nav{display:flex;gap:7px;overflow:auto;padding:5px 0}nav button{white-space:nowrap}small,.dim{color:#797370}.tag{font-size:12px;padding:4px 8px;background:#eee8e3;border-radius:20px;display:inline-block;margin:3px}.flex{display:flex;justify-content:space-between;gap:10px;align-items:center}.hero{padding:25px;background:#eae1d8;border-radius:16px}.hero h2{font-size:35px;margin:10px 0}.rows{display:grid;grid-template-columns:1fr 1fr;gap:7px}.rows>*{min-width:0}#notice{background:#e5f3e5;padding:12px;border-radius:9px;display:none}section{margin-top:15px}button:focus-visible{outline:3px solid #6b6b6b}</style><header><h1>UNVEIL<span style="color:#a27d72">.</span> <span style="font:12px system-ui;color:#666"> / BUSINESS LAB</span></h1><small>Interactive prototype</small></header><main><div class="switch"><button id="patient" class="active">UNVEIL · Patient</button><button id="clinic">ClinicFlow · Clinic</button></div><div id="notice"></div><div id="app"></div><p class="dim" style="font-size:12px">Fictional sample data only. No real patient data, payments or WhatsApp connection.</p></main><script>
const doctors=[{id:1,n:"Dr Lara Demir",c:"Turkey · Istanbul",p:4200,t:"Ethnic rhinoplasty, Thick skin, Natural results"},{id:2,n:"Dr Min Park",c:"South Korea · Seoul",p:6400,t:"Revision, Natural results"},{id:3,n:"Dr Oliver Kent",c:"UK · London",p:8900,t:"Thick skin, Revision"},{id:4,n:"Dr Sofia Reyes",c:"Mexico · Cancún",p:5100,t:"Ethnic rhinoplasty, Natural results"}];let view="patient",page="Discover",sel=1;const saved=new Set(),quotes=[],questions=["What is typically included in a written revision policy?"],leads=[{id:1,n:"Amelia R.",procedure:"Rhinoplasty",stage:"New enquiry",price:4200,m:["Hello, may I request a quotation?"]},{id:2,n:"Nora T.",procedure:"Revision rhinoplasty",stage:"Quoted",price:6800,m:["Does the quote include graft fees?"]},{id:3,n:"Sasha K.",procedure:"Rhinoplasty",stage:"Deposit paid",price:4800,m:["I've paid my deposit."]}];let tasks=["Follow up with Nora", "Confirm Sasha's arrival"],selectedLead=1;const $=x=>document.getElementById(x),escapeHtml=s=>String(s).replace(/[&<>"']/g,a=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[a])),gbp=n=>"£"+Number(n).toLocaleString("en-GB"),btn=(text,action,args="")=>'<button data-action="'+action+'" '+args+'>'+text+'</button>',box=s=>'<div class="box">'+s+'</div>',nav=(pages)=>'<nav>'+pages.map(p=>'<button class="'+(page===p?'active':'')+'" data-action="page" data-value="'+p+'">'+p+'</button>').join('')+'</nav>';function render(){ $('patient').className=view==='patient'?'active':'';$('clinic').className=view==='clinic'?'active':'';const app=$('app');if(view==='patient'){let h='<div class="hero"><small>INDEPENDENT RESEARCH</small><h2>Know more before you decide.</h2>Explore surgeons, experiences and prices in one place.</div>'+nav(["Discover","Compare","Quotes","Community"]);if(page==="Discover"){h+='<input id="search" placeholder="Search surgeon, country or speciality" aria-label="Search"><div id="results"></div>';}if(page==="Profile"){const d=doctors.find(d=>d.id===sel);h+=box('<small>FICTIONAL SURGEON PROFILE</small><h2>'+d.n+'</h2><p>'+d.c+'</p><p>'+d.t+'</p><p>Illustrative quoted price: <b>'+gbp(d.p)+'</b></p><h3>What is known?</h3><p>Registration: Not independently verified in demo</p><p>Clinical outcomes and revision rate: Not available</p><h3>Research checklist</h3><label><input type="checkbox" style="width:auto"> Verify professional registration</label><br><label><input type="checkbox" style="width:auto"> Request written aftercare policy</label><br><label><input type="checkbox" style="width:auto"> Verify operating facility</label><p>Patient experiences shown on this demo are not real.</p>'+btn(saved.has(sel)?"♥ Saved":"♡ Save surgeon","save",'data-id="'+sel+'"'));}if(page==="Compare"){h+='<h2>Your shortlist</h2>'+(saved.size?[...saved].map(id=>{let d=doctors.find(x=>x.id===id);return box('<div class="flex"><b>'+d.n+'</b><b>'+gbp(d.p)+'</b></div><p>'+d.c+'</p><small>'+d.t+'</small><p>Medical outcomes: not verified</p>'+btn("Remove","save",'data-id="'+id+'"'))}).join(''):box("Save surgeons on Discover to compare them here."));}if(page==="Quotes"){h+='<h2>Quote organiser</h2>'+box('<form id="quote-form"><label>Surgeon<select name="doctor">'+doctors.map(d=>'<option value="'+d.id+'">'+d.n+'</option>').join('')+'</select></label><label>Quoted amount in GBP<input name="amount" type="number" min="1" max="1000000" required></label><label>Package inclusions<input name="includes" required placeholder="Hospital, hotel, transfers"></label><button class="dark">Save quote</button></form>')+quotes.map((q,i)=>box('<b>'+doctors.find(d=>d.id==q.id).n+'</b><h2>'+gbp(q.amount)+'</h2><p>'+escapeHtml(q.includes)+'</p>'+btn("Remove","removequote",'data-id="'+i+'"'))).join('');}if(page==="Community"){h+='<h2>Research questions</h2>'+box('<form id="post-form"><textarea name="text" required maxlength="400" placeholder="Ask a question"></textarea><button class="dark">Post question</button></form>')+questions.map(q=>box('<small>Demo discussion</small><p>'+escapeHtml(q)+'</p>')).join('');}app.innerHTML=h;if(page==="Discover"){$('search').addEventListener('input',results);results();}}else{let h='<div class="hero" style="background:#dce8e3"><small>CLINIC OPERATIONS</small><h2>From enquiry to aftercare.</h2>Manage leads, quotations and patient conversations.</div>'+nav(["Pipeline","Inbox","Clinic quotes","Tasks"]);if(page==="Pipeline"){h+='<h2>Patient pipeline</h2>'+box('<form id="lead-form"><input name="name" required placeholder="Patient alias"><input name="procedure" required placeholder="Procedure"><button class="dark">+ Add lead</button></form>')+leads.map(l=>box('<div class="flex"><b>'+escapeHtml(l.n)+'</b><small>'+l.procedure+'</small></div><label>Stage<select data-stage="'+l.id+'">'+["New enquiry","Consultation","Quoted","Deposit paid","Booked","Post-op"].map(s=>'<option '+(s===l.stage?'selected':'')+'>'+s+'</option>').join('')+'</select></label>'+btn("Open patient","lead",'data-id="'+l.id+'"'))).join('');}if(page==="Lead"){const l=leads.find(l=>l.id===selectedLead);h+=box('<h2>'+escapeHtml(l.n)+'</h2><p>'+l.procedure+' · '+l.stage+'</p><form id="edit-quote"><label>Quote amount (£)<input name="amount" type="number" min="1" required value="'+l.price+'"></label><button class="dark">Update quotation</button></form><p>'+btn("Open conversation","inbox",'data-id="'+l.id+'"')+'</p>');}if(page==="Inbox"){let l=leads.find(l=>l.id===selectedLead);h+='<h2>Demo inbox</h2><select id="inboxselect">'+leads.map(x=>'<option value="'+x.id+'" '+(x.id===l.id?'selected':'')+'>'+escapeHtml(x.n)+'</option>').join('')+'</select>'+box('<b>'+l.n+'</b><p><small>Local simulation only — not WhatsApp</small></p>'+l.m.map(m=>'<p class="box">'+escapeHtml(m)+'</p>').join('')+'<form id="message-form"><input name="message" required placeholder="Type a demo message"><button class="dark">Send</button></form>');}if(page==="Clinic quotes"){h+='<h2>Quotes</h2>'+leads.map(l=>box('<div class="flex"><span><b>'+escapeHtml(l.n)+'</b><br><small>'+l.procedure+'</small></span><b>'+gbp(l.price)+'</b></div>'+btn("Edit","lead",'data-id="'+l.id+'"'))).join('');}if(page==="Tasks"){h+='<h2>Follow-ups</h2>'+box('<form id="task-form"><input name="task" required placeholder="New task"><button class="dark">Add task</button></form>')+tasks.map((t,i)=>box('<div class="flex"><span>'+escapeHtml(t)+'</span>'+btn("Done","task",'data-id="'+i+'"')+'</div>')).join('');}app.innerHTML=h;if($('inboxselect'))$('inboxselect').addEventListener('change',e=>{selectedLead=+e.target.value;render()});}}function results(){let q=($('search')?.value||'').toLowerCase();$('results').innerHTML=doctors.filter(d=>(d.n+d.c+d.t).toLowerCase().includes(q)).map(d=>box('<div class="flex"><b>'+d.n+'</b><b>'+gbp(d.p)+'</b></div><small>'+d.c+'</small><p>'+d.t+'</p>'+btn("View profile","profile",'data-id="'+d.id+'"')+' '+btn(saved.has(d.id)?"♥ Saved":"♡ Save","save",'data-id="'+d.id+'"'))).join('')||box("No results found.");}document.addEventListener('click',e=>{let a=e.target.closest('[data-action]');if(!a)return;let action=a.dataset.action,id=+a.dataset.id;if(action==="page"){page=a.dataset.value;render()}if(action==="profile"){sel=id;page="Profile";render()}if(action==="save"){saved.has(id)?saved.delete(id):saved.add(id);render()}if(action==="removequote"){quotes.splice(id,1);render()}if(action==="lead"){selectedLead=id;page="Lead";render()}if(action==="inbox"){selectedLead=id;page="Inbox";render()}if(action==="task"){tasks.splice(id,1);render()}});document.addEventListener('change',e=>{if(e.target.dataset.stage){let l=leads.find(l=>l.id==e.target.dataset.stage);l.stage=e.target.value;render()}});document.addEventListener('submit',e=>{if(!e.target.closest('#app'))return;e.preventDefault();let f=e.target,form=new FormData(f);if(f.id==="quote-form"){let amount=+form.get('amount');if(amount>0)quotes.push({id:+form.get('doctor'),amount,includes:form.get('includes')})}if(f.id==="post-form")questions.unshift(form.get('text'));if(f.id==="lead-form")leads.push({id:Date.now(),n:form.get('name'),procedure:form.get('procedure'),stage:'New enquiry',price:0,m:[]});if(f.id==="edit-quote")leads.find(l=>l.id===selectedLead).price=+form.get('amount');if(f.id==="message-form")leads.find(l=>l.id===selectedLead).m.push(form.get('message'));if(f.id==="task-form")tasks.push(form.get('task'));render()});$('patient').onclick=()=>{view='patient';page='Discover';render()};$('clinic').onclick=()=>{view='clinic';page='Pipeline';render()};render();</script></html>
